# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection
- unit-test

default:
  tags:
    - dev
    - rnd02

include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: test

variables:
  SECRET_DETECTION_ENABLED: 'true'
  PHP_IMAGE: php:8.5-fpm-alpine3.23
  UNIT_TEST: true  

.install_cert: &install_cert
  - apk add --no-cache ca-certificates
  - update-ca-certificates  
  - cp cicd/php/99-ssl.ini /usr/local/etc/php/conf.d/99-ssl.ini

.install_composer: &install_composer
  - ./cicd/php/install_composer.sh
  - mv composer.phar /usr/local/bin/composer

.install_xdebug: &install_xdebug
  - apk update
  - apk add --no-cache --virtual .build-deps $PHPIZE_DEPS linux-headers
  - pecl install xdebug-3.5.3
  - docker-php-ext-enable xdebug
  - cp cicd/php/docker-php-ext-xdebug.ini /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini

.php_setup: &php_setup
  - *install_cert
  - *install_composer
  - *install_xdebug
  - php -i

secret_detection:
  stage: secret-detection

php8.5:   # This job runs in the test stage.
  image: $PHP_IMAGE
  stage: unit-test    # It only starts when the job in the build stage completes successfully.
  before_script:
    - *php_setup
    - composer install
  script:
    - php -d memory_limit=-1 vendor/bin/phpunit -c cicd/phpunit.xml --coverage-text
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  rules:
    - if: $UNIT_TEST == 'true'
      when: always
    - if: $UNIT_TEST == 'false'
      when: never

php8.4:
  image: php:8.4.25-fpm-alpine3.23
  stage: unit-test    # It only starts when the job in the build stage completes successfully.
  before_script:
    - *php_setup
    - composer install
  script:
    - php -d memory_limit=-1 vendor/bin/phpunit -c cicd/phpunit.xml --coverage-text
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  rules:
    - if: $UNIT_TEST == 'true'
      when: always
    - if: $UNIT_TEST == 'false'
      when: never